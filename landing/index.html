<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
  <title>LocJobs</title>
  <link rel="icon" type="image/png" href="icon.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }

    :root {
      --brand: #FF6B35;
      --brand-light: #FFF0E8;
      --bg: #FFF8F4;
      --card-bg: #FFFFFF;
      --border: #F0E4DA;
      --text: #2D2B2A;
      --text-secondary: #A09388;
      --muted: #666;
      --success: #2ECC71;
      --success-bg: #E8F8F0;
      --warning: #F1C40F;
      --warning-bg: #FEF9E7;
      --danger: #E74C3C;
      --danger-bg: #FDEDEC;
      --radius: 16px;
      --shadow: 0 2px 8px rgba(0,0,0,0.06);
    }

    body {
      font-family: 'Plus Jakarta Sans', -apple-system, BlinkMacSystemFont, sans-serif;
      background: var(--bg);
      min-height: 100vh;
      padding: clamp(12px, 3vw, 32px);
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    .wrap {
      width: 100%;
      max-width: 560px;
      margin: 0 auto;
    }

    .top-bar {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 12px 0 8px;
      margin-bottom: clamp(8px, 2vw, 16px);
    }
    .top-bar .logo-icon {
      width: clamp(28px, 7vw, 36px);
      height: clamp(28px, 7vw, 36px);
      border-radius: 8px;
      flex-shrink: 0;
    }
    .top-bar h1 {
      font-size: clamp(20px, 5.5vw, 24px);
      font-weight: 800;
      color: var(--brand);
      letter-spacing: -0.5px;
    }

    .card {
      background: var(--card-bg);
      border-radius: var(--radius);
      padding: clamp(16px, 4vw, 24px);
      width: 100%;
      border: 1px solid var(--border);
      box-shadow: var(--shadow);
      margin-bottom: clamp(8px, 2vw, 12px);
    }

    .card-header {
      display: flex;
      align-items: flex-start;
      justify-content: space-between;
      gap: 12px;
      margin-bottom: 10px;
    }
    .card-title {
      font-size: clamp(18px, 5vw, 22px);
      font-weight: 700;
      color: var(--text);
      flex: 1;
      line-height: 1.3;
      letter-spacing: -0.3px;
      overflow-wrap: anywhere;
    }

    .badge {
      font-size: 11px;
      font-weight: 700;
      padding: 4px 10px;
      border-radius: 8px;
      text-transform: capitalize;
      white-space: nowrap;
      margin-top: 2px;
      flex-shrink: 0;
    }
    .badge-open { background: var(--success-bg); color: var(--success); }
    .badge-full { background: var(--warning-bg); color: var(--warning); }
    .badge-completed { background: var(--brand-light); color: var(--brand); }
    .badge-cancelled { background: var(--danger-bg); color: var(--danger); }

    .tags {
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
      margin-bottom: 10px;
    }
    .tag {
      font-size: 12px;
      color: var(--text-secondary);
      background: var(--bg);
      padding: 4px 10px;
      border-radius: 8px;
      font-weight: 600;
      max-width: 100%;
      overflow-wrap: anywhere;
    }
    .tag-primary {
      color: var(--brand);
      background: var(--brand-light);
    }

    .price {
      font-size: clamp(20px, 5.5vw, 24px);
      font-weight: 800;
      color: var(--text);
      margin-bottom: 6px;
      letter-spacing: -0.3px;
      overflow-wrap: anywhere;
    }
    .posted {
      font-size: 12px;
      color: var(--text-secondary);
      font-weight: 500;
      margin-bottom: 10px;
    }
    .location-line {
      display: flex;
      align-items: center;
      gap: 6px;
      font-size: 13px;
      color: var(--text-secondary);
      font-weight: 600;
      margin-bottom: 12px;
      overflow-wrap: anywhere;
    }
    .pin-icon {
      width: 15px;
      height: 15px;
      color: var(--brand);
      flex-shrink: 0;
    }
    .description {
      font-size: 14px;
      color: var(--muted);
      line-height: 1.7;
      margin-bottom: 0;
      white-space: pre-wrap;
      overflow-wrap: anywhere;
    }

    .divider {
      height: 1px;
      background: var(--border);
      margin: 16px 0;
    }
    .section-label {
      font-size: 13px;
      font-weight: 700;
      color: var(--text);
      margin-bottom: 10px;
      letter-spacing: -0.2px;
    }

    .image-scroll {
      display: flex;
      gap: 8px;
      overflow-x: auto;
      scroll-snap-type: x mandatory;
      -webkit-overflow-scrolling: touch;
      padding-bottom: 4px;
      scrollbar-width: none;
    }
    .image-scroll::-webkit-scrollbar { display: none; }
    .image-scroll img {
      width: clamp(200px, 75vw, 300px);
      aspect-ratio: 7 / 5;
      height: auto;
      border-radius: 12px;
      object-fit: cover;
      flex-shrink: 0;
      scroll-snap-align: start;
      background: #F5F0EB;
    }
    .image-dots {
      display: flex;
      justify-content: center;
      gap: 6px;
      margin-top: 8px;
    }
    .image-dot {
      width: 6px;
      height: 6px;
      border-radius: 3px;
      background: #DDD5CE;
      transition: width 0.2s;
    }
    .image-dot.active {
      width: 18px;
      background: var(--brand);
    }

    .uploader-row {
      display: flex;
      align-items: center;
      gap: 12px;
      min-width: 0;
    }
    .uploader-avatar {
      width: clamp(40px, 10vw, 48px);
      height: clamp(40px, 10vw, 48px);
      border-radius: 50%;
      background: var(--brand);
      display: flex;
      align-items: center;
      justify-content: center;
      color: #FFF;
      font-weight: 700;
      font-size: 16px;
      flex-shrink: 0;
      overflow: hidden;
    }
    .uploader-avatar img {
      width: 100%;
      height: 100%;
      border-radius: 50%;
      object-fit: cover;
    }
    .uploader-info {
      flex: 1;
      min-width: 0;
    }
    .uploader-name {
      font-size: 15px;
      font-weight: 700;
      color: var(--text);
      display: flex;
      align-items: center;
      gap: 4px;
      flex-wrap: wrap;
      overflow-wrap: anywhere;
    }
    .verified-badge {
      width: 16px;
      height: 16px;
      vertical-align: middle;
      flex-shrink: 0;
    }
    .uploader-phone {
      font-size: 13px;
      color: var(--text-secondary);
      font-weight: 500;
      margin-top: 1px;
      overflow-wrap: anywhere;
    }

    .app-section {
      text-align: center;
      padding: 4px 0;
    }
    .app-section p {
      font-size: 14px;
      color: var(--text-secondary);
      font-weight: 500;
      margin-bottom: 14px;
      line-height: 1.5;
    }
    .btn-row {
      display: flex;
      gap: 10px;
      justify-content: center;
      flex-wrap: wrap;
    }
    .btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      background: var(--brand);
      color: #FFFFFF;
      padding: 14px 28px;
      border-radius: 12px;
      text-decoration: none;
      font-weight: 700;
      font-size: 15px;
      border: none;
      cursor: pointer;
      transition: opacity 0.2s, transform 0.1s;
      flex: 1 1 auto;
      min-width: 0;
    }
    .btn:hover { opacity: 0.9; }
    .btn:active { transform: scale(0.98); }
    .btn-outline {
      background: transparent;
      color: var(--brand);
      border: 1.5px solid var(--brand);
    }

    .spinner {
      width: 28px;
      height: 28px;
      border: 3px solid var(--border);
      border-top-color: var(--brand);
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
      margin: 40px auto;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
    .error-state {
      text-align: center;
      padding: 40px 20px;
    }
    .error-state h2 {
      font-size: 18px;
      color: var(--text);
      margin-bottom: 8px;
    }
    .error-state p {
      font-size: 14px;
      color: var(--text-secondary);
      line-height: 1.5;
    }
    .loader-wrap {
      display: flex;
      justify-content: center;
      padding: 60px 0;
    }

    @media (min-width: 640px) {
      body { justify-content: flex-start; }
      .wrap { padding-top: 24px; }
      .card-header { margin-bottom: 14px; }
      .btn { flex: 0 1 auto; }
    }

    @media (min-width: 1024px) {
      body { padding: 40px; }
      .wrap { max-width: 640px; }
      .card { padding: 28px; }
      .image-scroll img { width: clamp(240px, 40vw, 360px); }
    }
  </style>
</head>
<body>
  <div class="wrap">
    <div class="top-bar">
      <img class="logo-icon" src="icon.png" alt="LocJobs">
      <h1>LocJobs</h1>
    </div>

    <div id="content">
      <div class="loader-wrap">
        <div class="spinner"></div>
      </div>
    </div>
  </div>

  <script>
    var SUPABASE_URL = 'https://axuroixwxueufgvodnde.supabase.co';
    var SUPABASE_ANON_KEY = 'sb_publishable_Owcd89uuD3g2DE7ZzSeUgw_RufrNPCr';

    var EMPLOYMENT_LABELS = {
      full_time: 'Full-Time', part_time: 'Part-Time', contract: 'Contract',
      permanent: 'Permanent', freelance: 'Freelance', internship: 'Internship',
      temporary: 'Temporary'
    };
    var SALARY_PERIOD_LABELS = { month: '/month', week: '/week', day: '/day', hour: '/hour', year: '/year' };
    var CURRENCY_SYMBOLS = {
      MMK: 'Ks', USD: '$', EUR: '€', GBP: '£', SGD: 'S$', THB: '฿',
      JPY: '¥', KRW: '₩', CNY: '¥', INR: '₹'
    };

    var params = new URLSearchParams(window.location.search);
    var jobId = params.get('id');
    var content = document.getElementById('content');

    var DEEP_LINK = jobId ? 'locjobs://job/' + jobId : null;
    var DOWNLOAD_URL = 'https://expo.dev/accounts/phyothant_0/projects/loc-jobs/builds/ec669684-1e37-4c7d-8bc2-4d52fb23bec1';

    function tryOpenApp() {
      if (!DEEP_LINK) return;
      window.location.href = DEEP_LINK;
    }

    function relativeTime(dateStr) {
      var diff = Date.now() - new Date(dateStr).getTime();
      var mins = Math.floor(diff / 60000);
      if (mins < 1) return 'now';
      if (mins < 60) return mins + 'm ago';
      var hours = Math.floor(mins / 60);
      if (hours < 24) return hours + 'h ago';
      var days = Math.floor(hours / 24);
      if (days < 7) return days + 'd ago';
      var d = new Date(dateStr);
      return d.toLocaleDateString('en-US', { month: 'short', day: 'numeric', year: 'numeric' });
    }

    function formatPrice(amount, currency) {
      if (amount == null) return null;
      var code = currency || 'MMK';
      var symbol = CURRENCY_SYMBOLS[code] || code;
      return amount.toLocaleString() + ' ' + symbol;
    }

    function formatSalary(min, max, period, currency) {
      var s = min != null ? min.toLocaleString() : '';
      if (max != null) s += ' - ' + max.toLocaleString();
      if (period) s += ' ' + (SALARY_PERIOD_LABELS[period] || '/' + period);
      var code = currency || 'MMK';
      var symbol = CURRENCY_SYMBOLS[code] || code;
      return s ? s + ' ' + symbol : null;
    }

    function parseUrls(urls) {
      if (Array.isArray(urls)) return urls;
      if (typeof urls === 'string') {
        try { return JSON.parse(urls); } catch(e) {}
        if (urls.startsWith('{') && urls.endsWith('}')) return urls.slice(1, -1).split(',').map(function(s) { return s.trim(); });
      }
      return [];
    }

    function renderCard(job, uploader) {
      var statusClass = 'badge-' + job.status;

      var tagsHtml = '<span class="tag tag-primary">' + (job.work_type || '') + '</span>';
      if (job.employment_type) {
        tagsHtml += '<span class="tag">' + (EMPLOYMENT_LABELS[job.employment_type] || job.employment_type) + '</span>';
      }
      if (job.category) {
        tagsHtml += '<span class="tag">' + escapeHtml(job.category) + '</span>';
      }
      var locationParts = [];
      if (job.region) locationParts.push(job.region);
      else if (job.city) locationParts.push(job.city);
      var locationHtml = '';
      if (locationParts.length) {
        locationHtml = '<div class="location-line"><svg class="pin-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 10c0 7-9 13-9 13s-9-6-9-13a9 9 0 0 1 18 0z"/><circle cx="12" cy="10" r="3"/></svg><span>' + escapeHtml(locationParts.join(', ')) + '</span></div>';
      }
      if (job.vacancies > 1) {
        tagsHtml += '<span class="tag">' + job.vacancies + ' openings</span>';
      }

      var currency = job.currency || 'MMK';

      var priceHtml = '';
      if (job.price != null) {
        var priceText = formatPrice(job.price, currency);
        if (priceText) priceHtml += '<div class="price">' + priceText + '</div>';
      }
      if (job.salary_min != null && job.employment_type) {
        var formatted = formatSalary(job.salary_min, job.salary_max, job.salary_period, currency);
        if (formatted) priceHtml += '<div class="price">' + formatted + '</div>';
      }

      var postedHtml = '<div class="posted">Posted ' + relativeTime(job.created_at || job.createdAt) + '</div>';

      var descHtml = job.description ? '<div class="description">' + escapeHtml(job.description) + '</div>' : '';

      var raw = job.image_urls;
      var images = parseUrls(raw);
      var imagesHtml = '';
      if (images.length > 0) {
        var imgs = '';
        for (var i = 0; i < images.length; i++) {
          imgs += '<img src="' + escapeHtml(images[i]) + '" alt="Job image ' + (i+1) + '" loading="lazy" onclick="window.open(\'' + escapeHtml(images[i]) + '\', \'_blank\')">';
        }
        var dots = '';
        if (images.length > 1) {
          for (var i = 0; i < images.length; i++) {
            dots += '<span class="image-dot' + (i === 0 ? ' active' : '') + '" data-index="' + i + '"></span>';
          }
        }
        imagesHtml = '<div class="divider"></div><div class="section-label">Photos</div><div class="image-scroll" id="image-scroll">' + imgs + '</div><div class="image-dots" id="image-dots">' + dots + '</div>';

        setTimeout(function() {
          var scroll = document.getElementById('image-scroll');
          var dots = document.getElementById('image-dots');
          if (scroll && dots) {
            scroll.addEventListener('scroll', function() {
              var imgW = (scroll.querySelector('img') || { width: 280 }).width || 280;
              var idx = Math.round(scroll.scrollLeft / imgW);
              var spans = dots.querySelectorAll('.image-dot');
              for (var i = 0; i < spans.length; i++) {
                spans[i].className = 'image-dot' + (i === idx ? ' active' : '');
              }
            });
          }
        }, 100);
      }

      var uploaderHtml = '';
      if (uploader) {
        var avatarHtml = '';
        if (uploader.avatar_url) {
          avatarHtml = '<img src="' + escapeHtml(uploader.avatar_url) + '" alt="Avatar">';
        } else {
          avatarHtml = (uploader.display_name || '?')[0].toUpperCase();
        }
        var verifiedHtml = uploader.verified ? '<svg class="verified-badge" viewBox="0 0 24 24" fill="#2ECC71"><path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm-2 15l-5-5 1.41-1.41L10 14.17l7.59-7.59L19 8l-9 9z"/></svg>' : '';
        uploaderHtml = '<div class="divider"></div><div class="section-label">Posted by</div><div class="uploader-row"><div class="uploader-avatar">' + avatarHtml + '</div><div class="uploader-info"><div class="uploader-name">' + escapeHtml(uploader.display_name || 'Anonymous') + ' ' + verifiedHtml + '</div>' + (uploader.phone ? '<div class="uploader-phone">' + escapeHtml(uploader.phone) + '</div>' : '') + '</div></div>';
      }

      content.innerHTML = `
        <div class="card">
          <div class="card-header">
            <div class="card-title">${escapeHtml(job.title)}</div>
            <span class="badge ${statusClass}">${job.status}</span>
          </div>
          <div class="tags">${tagsHtml}</div>
          ${priceHtml}
          ${postedHtml}
          ${locationHtml}
          ${descHtml}
          ${imagesHtml}
          ${uploaderHtml}
        </div>
        <div class="card" style="margin-top: 0;">
          <div class="app-section">
            <p>Get the full experience — apply, chat, and manage your jobs on the go.</p>
            <div class="btn-row">
              <button class="btn" onclick="tryOpenApp()">Open in App</button>
              <a class="btn btn-outline" href="${DOWNLOAD_URL}" target="_blank" rel="noopener">Download App</a>
            </div>
          </div>
        </div>
      `;
    }

    function escapeHtml(str) {
      if (!str) return '';
      var div = document.createElement('div');
      div.textContent = str;
      return div.innerHTML;
    }

    if (jobId) {
      fetch(SUPABASE_URL + '/rest/v1/jobs?id=eq.' + jobId + '&select=*', {
        headers: {
          'apikey': SUPABASE_ANON_KEY,
          'Authorization': 'Bearer ' + SUPABASE_ANON_KEY,
        }
      })
      .then(function(r) { return r.json(); })
      .then(function(data) {
        if (data && data.length > 0) {
          var job = data[0];
          fetch(SUPABASE_URL + '/rest/v1/users?id=eq.' + job.uploader_id + '&select=display_name,avatar_url,phone,verified', {
            headers: {
              'apikey': SUPABASE_ANON_KEY,
              'Authorization': 'Bearer ' + SUPABASE_ANON_KEY,
            }
          })
          .then(function(r) { return r.json(); })
          .then(function(userData) {
            var uploader = userData && userData.length > 0 ? userData[0] : null;
            renderCard(job, uploader);
          })
          .catch(function() {
            renderCard(job, null);
          });
        } else {
          content.innerHTML = '<div class="card"><div class="error-state"><h2>Job not found</h2><p>This job may have been removed or the link is invalid.</p></div></div>';
        }
      })
      .catch(function() {
        content.innerHTML = '<div class="card"><div class="error-state"><h2>Something went wrong</h2><p>Could not load this job. Please try again.</p></div></div>';
      });
    } else {
      content.innerHTML = '<div class="card"><div class="error-state"><h2>Invalid link</h2><p>No job ID provided.</p></div></div>';
    }
  </script>
</body>
</html>
